name: CI

# Runs the same checks `npm run validate` runs locally, in the same order,
# so a CI failure is always reproducible by running that one command
# locally. See docs/ROADMAP.md (P009) and docs/NERA_CONSTITUTION.md for why
# this exists: Milestone 2's own exit criterion is "CI blocks a PR that
# fails lint, typecheck, or tests."
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run on the same branch/PR when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job needs to write anything (no deploy, no PR comments, no releases in
# this sprint) - least privilege by default.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # PostgreSQL-backed CI (P012 - see docs/ROADMAP.md): behavioral Row Level
    # Security tests need a real database - RLS cannot be honestly verified
    # against a fake/mocked client. This is a throwaway, CI-local database
    # with a fixed, non-secret password (not a production credential) - no
    # GitHub Actions secret is introduced.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nera_test
      # Fixed, non-secret CI-local credential for the least-privilege
      # application role (P013A) - never a production credential, no GitHub
      # Actions secret needed, matching the Postgres service password above.
      APP_DATABASE_URL: postgresql://nera_app_role:nera_app_role_ci_password@localhost:5432/nera_test
      APP_DB_PASSWORD: nera_app_role_ci_password
      # SeaweedFS local/CI storage provider (ADR-011, P014) - a throwaway,
      # CI-local S3-compatible endpoint with a fixed, non-secret identity
      # (not a production credential), matching the Postgres env above. See
      # the "Start SeaweedFS" step for how this identity is provisioned.
      DOCUMENT_STORAGE_BUCKET: nera-test-bucket
      DOCUMENT_STORAGE_REGION: us-east-1
      DOCUMENT_STORAGE_ENDPOINT: http://127.0.0.1:8333
      DOCUMENT_STORAGE_FORCE_PATH_STYLE: 'true'
      DOCUMENT_STORAGE_ACCESS_KEY_ID: nera_ci_test
      DOCUMENT_STORAGE_SECRET_ACCESS_KEY: nera_ci_test_secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Deterministic install from the committed lockfile only - never
      # `npm install` in CI. This is also what catches lockfile drift
      # immediately (see docs/ROADMAP.md P009 for the exact failure this
      # sprint found and fixed).
      - name: Install dependencies
        run: npm ci

      # SeaweedFS local/CI storage provider (ADR-011 Decision item 3/11/12;
      # P014). Pinned by exact version, release tag, and independently
      # verified SHA-256 - the Linux x64 counterpart to the Windows binary
      # already pinned in ADR-011 item 11 (same version 4.40, release tag
      # `4.40`, commit 875cd1f67ea25e8965a4f5ba1e6aaf501ba6b6fa - verified via
      # this exact binary's own startup log: "Start Seaweed S3 API Server
      # ... 4.40 875cd1f..."). The digest below was computed independently
      # against `https://github.com/seaweedfs/seaweedfs/releases/download/4.40/linux_amd64.tar.gz`
      # - never `latest`, never re-fetched without verification. CI fails
      # loudly on any mismatch, before the binary is ever executed. The
      # identity config is a throwaway, CI-local credential (see the job
      # `env` above) - never a production secret.
      - name: Start SeaweedFS (S3-compatible storage, local/CI - ADR-011, pinned + verified)
        run: |
          set -euo pipefail
          EXPECTED_SHA256="0c63aec15429d17e216fdb878a92532188d3e147d7f072645bfec9eb6f992a02"
          mkdir -p /tmp/seaweedfs
          curl -sL -o /tmp/seaweedfs/linux_amd64.tar.gz \
            "https://github.com/seaweedfs/seaweedfs/releases/download/4.40/linux_amd64.tar.gz"
          ACTUAL_SHA256="$(sha256sum /tmp/seaweedfs/linux_amd64.tar.gz | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "SeaweedFS binary SHA-256 mismatch - refusing to run an unverified binary." >&2
            echo "expected: $EXPECTED_SHA256" >&2
            echo "actual:   $ACTUAL_SHA256" >&2
            exit 1
          fi
          echo "SeaweedFS binary SHA-256 verified: $ACTUAL_SHA256"
          tar -xzf /tmp/seaweedfs/linux_amd64.tar.gz -C /tmp/seaweedfs
          chmod +x /tmp/seaweedfs/weed

          cat > /tmp/seaweedfs/s3.config.json <<'EOF'
          {
            "identities": [
              {
                "name": "nera_ci_test",
                "credentials": [
                  { "accessKey": "nera_ci_test", "secretKey": "nera_ci_test_secret" }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          EOF

          /tmp/seaweedfs/weed server -dir=/tmp/seaweedfs/data -s3 -s3.port=8333 \
            -s3.config=/tmp/seaweedfs/s3.config.json \
            -master.port=9333 -volume.port=8080 -filer.port=8888 -metricsPort=0 \
            > /tmp/seaweedfs/weed.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8333/ -w '%{http_code}' | grep -qE '^(200|403)$'; then
              echo "SeaweedFS S3 gateway is up."
              exit 0
            fi
            sleep 1
          done
          echo "SeaweedFS S3 gateway did not become ready in time." >&2
          cat /tmp/seaweedfs/weed.log >&2
          exit 1

      # npm ci does not generate the Prisma Client (no postinstall hook does
      # this here) - only @nera/database's own build/typecheck scripts chain
      # `prisma generate` in, and those run later in this workflow. Anything
      # that imports @prisma/client before then - such as the bootstrap
      # script below, which constructs a real PrismaClient - fails with
      # "@prisma/client did not initialize yet." `prisma migrate deploy`
      # doesn't need the generated client (it uses its own migration engine),
      # which is why that step alone wouldn't have surfaced this gap.
      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@nera/database

      # Apply every migration (including P012's institutions table and
      # FORCE ROW LEVEL SECURITY retrofit) to the CI-local database, then
      # bootstrap the restricted, NOLOGIN, NOSUPERUSER, NOBYPASSRLS role
      # behavioral RLS tests run under - see packages/database/README.md.
      # Both steps are idempotent and reusable locally against any
      # DATABASE_URL, not just this CI database.
      - name: Apply database migrations
        run: npm run db:migrate:deploy --workspace=@nera/database

      - name: Bootstrap RLS test role
        run: npm run db:bootstrap-rls-role --workspace=@nera/database

      # Least-privilege application role (P013A - see
      # packages/database/README.md). Must run after migrations (it revokes
      # access to _prisma_migrations, which migrate deploy creates) and
      # before the seed step below (seed.ts itself still uses the
      # administrative `prisma` client, but real application code - and any
      # future test relying on it - needs this role to already exist).
      - name: Bootstrap application role
        run: npm run db:bootstrap-app-role --workspace=@nera/database

      - name: Seed database
        run: npm run db:seed --workspace=@nera/database

      - name: Check formatting
        run: npm run check-format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
